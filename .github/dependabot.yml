version: 2
updates:
  # Keep the GitHub Actions used in workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per action bump: each lands (or fails CI) on its own, so a broken
    # bump never blocks the rest of the week's updates.
    # Match the commit style in CONTRIBUTING.md: "build(deps): bump ..."
    commit-message:
      prefix: "build"
      include: "scope"

  # Keep npm dependencies up to date. The FTP client and the HTML parser are the
  # two that matter: one talks to a live server, the other parses markup nobody
  # promised to keep stable.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
